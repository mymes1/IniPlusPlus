name: Ini++ Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: "26.1.10909125"

jobs:
  host-tests:
    name: Host tests and workflow checks
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host build and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes build-essential zip unzip

      - name: Print tool versions
        run: |
          g++ --version | head -1
          python3 --version

      - name: Check generated ACE metadata
        run: python3 tools/gen_android_aces.py --check

      - name: Check shell script syntax
        run: |
          for script in tools/*.sh; do
            bash -n "$script"
          done

      - name: Run C++ bridge host tests
        run: bash tools/run_host_tests.sh

      - name: Run C++ bridge tests with ASan and UBSan
        run: SANITIZE=1 bash tools/run_host_tests.sh

      - name: Check workflow mirror
        run: bash tools/sync_workflow.sh --check

  android-jni:
    name: Android JNI libraries and overlay
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # JDK 17 is used by sdkmanager here. It is not a validated JDK for
      # the Fusion 295.10 Gradle exporter.
      - name: Install Java for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK command-line tools
        uses: android-actions/setup-android@v3

      - name: Install pinned NDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK root was not set by setup-android." >&2
            exit 1
          fi

          # Avoid treating `yes` getting SIGPIPE after sdkmanager finishes as a failure.
          set +o pipefail
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail

          sdkmanager --sdk_root="$SDK_ROOT" \
            --install "platform-tools" "ndk;${ANDROID_NDK_VERSION}"

          NDK_DIR="$SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          if [ ! -x "$NDK_DIR/ndk-build" ]; then
            echo "Expected ndk-build at $NDK_DIR/ndk-build" >&2
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Install ZIP utilities
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes zip unzip

      - name: Verify ACE metadata
        run: python3 tools/gen_android_aces.py --check

      - name: Build JNI libraries for all configured ABIs
        run: tools/build_android.sh --out build/android

      - name: Package project-owned Android overlay
        run: |
          tools/package_android_extension.sh \
            --android-dir build/android \
            --out build/android-package

      - name: Upload Android native libraries and overlay
        uses: actions/upload-artifact@v4
        with:
          name: android-jni-overlay-unverified
          path: |
            build/android/assets/mmf/**/libIniPlusPlusBridge.so
            build/android-package/INI++.zip
          if-no-files-found: error
          retention-days: 30

  windows-mfx:
    name: Windows MFX files
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Runtime and Edittime MFX
        shell: pwsh
        run: |
          msbuild INI++15.vcxproj `
            /m /nologo /v:minimal `
            /p:Configuration=Runtime /p:Platform=Win32 /p:PostBuildEventUseInBuild=false

          msbuild INI++15.vcxproj `
            /m /nologo /v:minimal `
            /p:Configuration=Edittime /p:Platform=Win32 /p:PostBuildEventUseInBuild=false

      - name: Collect and check MFX files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force `
            -Path "dist/windows/runtime", "dist/windows/edittime" | Out-Null

          Copy-Item "Build/Output/Runtime/INI++15.mfx" `
            "dist/windows/runtime/INI++.mfx"
          Copy-Item "Build/Output/Edittime/INI++15.mfx" `
            "dist/windows/edittime/INI++.mfx"

          $vsRoot = "${env:ProgramFiles(x86)}\Microsoft Visual Studio"
          $dumpbin = Get-ChildItem $vsRoot -Recurse -Filter dumpbin.exe `
            -ErrorAction SilentlyContinue | Select-Object -First 1

          if (-not $dumpbin) {
            throw "dumpbin.exe was not found; cannot check runtime MFX exports"
          }

          $dumpbinPath = $dumpbin.FullName
          $exports = & $dumpbinPath /nologo /exports `
            "dist/windows/runtime/INI++.mfx" | Out-String

          foreach ($symbol in @(
            "GetInfos",
            "GetRunObjectInfos",
            "CreateRunObject",
            "GetRunObjectDataSize"
          )) {
            if ($exports -notmatch $symbol) {
              throw "Runtime MFX does not export $symbol"
            }
          }

      - name: Upload Windows MFX files
        uses: actions/upload-artifact@v4
        with:
          name: windows-mfx
          path: dist/windows/**/*.mfx
          if-no-files-found: error
          retention-days: 30
